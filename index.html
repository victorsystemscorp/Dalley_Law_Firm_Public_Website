<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dalley Law Firm, P.C. — Choose Your Language / Elija Su Idioma</title>
  <meta name="description" content="Dalley Law Firm, P.C. — over 25 years protecting New York's immigrant community. Choose English or Español to continue." />
  <link rel="canonical" href="https://victorsystemscorp.github.io/Dalley_Law_Firm_Public_Website/index.html" />
  <link rel="icon" href="./assets/images/logo.png" type="image/png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dalley Law Firm, P.C." />
  <meta property="og:description" content="Over 25 years protecting New York's immigrant community." />
  <meta property="og:image" content="/assets/images/hero.jpg" />
  <meta name="theme-color" content="#0B2545" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <script>
    /* One-time language hint: redirect first-time visitors based on browser language.
       Explicit button clicks always win and are marked via dalleyMarkChosen(). */
    (function () {
      try {
        if (sessionStorage.getItem("dalleylaw_langChosen")) return;
        if (localStorage.getItem("dalleylaw_langSeen")) return;
        localStorage.setItem("dalleylaw_langSeen", "1");
        var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
        var go = lang.indexOf("es") === 0 ? "es/index.html" : "en/index.html";
        if (location.search) go += location.search;
        location.replace(go);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="selector">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">
    <section class="hero" style="min-height: 100vh; display: flex; align-items: center;">
      <div class="hero__bg" aria-hidden="true"><img src="assets/images/hero.jpg" alt="" /></div>
      <div class="container hero__inner" style="text-align:center; margin:0 auto; max-width:760px;">
        <div style="background:#fff; padding:1.1rem; border-radius:14px; display:inline-block; margin-bottom:2rem; box-shadow:var(--shadow-lg);">
          <img src="assets/images/logo.png" alt="Dalley Law Firm, P.C. logo" width="360" height="120" style="height:110px; width:auto;" />
        </div>
        <h1 style="font-size:clamp(2.2rem,5vw,3.2rem);">Dalley Law Firm, P.C.</h1>
        <p class="lead" style="max-width:560px; margin:0 auto 2.2rem;">
          For over 25 years, fighting for New York's immigrant community. Choose your language to continue.
          <br />
          <span style="display:block; margin-top:.4rem;">Por más de 25 años, luchando por la comunidad inmigrante de Nueva York. Elija su idioma para continuar.</span>
        </p>
        <div class="hero__cta" style="justify-content:center;">
          <a class="btn btn--gold btn--lg" href="en/index.html" onclick="dalleyMarkChosen()">English</a>
          <a class="btn btn--outline btn--lg" href="es/index.html" onclick="dalleyMarkChosen()">Español</a>
        </div>
        <p style="margin-top:2.4rem; font-size:.95rem; color:rgba(244,241,234,.8);">
          <span aria-hidden="true">📞</span>
          <a href="tel:+17185546300" style="color:var(--c-gold-soft); font-weight:700;">(718) 554-6300</a>
          <span style="opacity:.5;"> &middot; </span>
          <span style="color:rgba(244,241,234,.85);">24/7 consultations</span>
        </p>
      </div>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
